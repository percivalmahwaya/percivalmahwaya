<svg xmlns="http://www.w3.org/2000/svg" width="394" height="422" viewBox="0 0 394 422" role="img" aria-label="Animation of a knight's tour on a chessboard. A knight starts on a1 and visits all 64 squares exactly once in 63 moves, ending on h5. Each visited square is numbered in order.">
<title>Animation of a knight's tour on a chessboard. A knight starts on a1 and visits all 64 squares exactly once in 63 moves, ending on h5. Each visited square is numbered in order.</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}
.lab{font-size:11px;fill:#8b949e;text-anchor:middle}.cap{font-size:13px;fill:#8b949e;text-anchor:middle}
.n{font-size:10px;fill:#7ee787;text-anchor:middle;opacity:0;animation:show 0s linear forwards}
@keyframes show{to{opacity:1}}
.trail{fill:none;stroke:#7ee787;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;opacity:.55;stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 9.45s linear 0.6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.k{fill:#7ee787}.kt{font-size:14px;font-weight:700;fill:#0d1117;text-anchor:middle}
@media (prefers-reduced-motion:reduce){.n{opacity:1;animation:none}.trail{stroke-dashoffset:0;animation:none}.knight{display:none}}
</style>
